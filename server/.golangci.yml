# Strict linters: the standard set plus checks that catch real bugs (ignored errors, forgotten
# contexts, unclosed resources, security) and a single style.
version: "2"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose # HTTP response bodies are closed
    - contextcheck # contexts are passed down, not recreated
    - copyloopvar
    - errorlint # errors compared with errors.Is / As
    - gocritic
    - gosec
    - misspell
    - nilerr
    - noctx # HTTP requests carry a context
    - nolintlint # no //nolint without a reason
    - perfsprint
    - prealloc
    - revive
    - thelper
    - unconvert
    - unparam
    - usestdlibvars
    - wastedassign
  settings:
    gocritic:
      enabled-tags: [diagnostic, style, performance]
    govet:
      enable-all: true
      disable:
        - fieldalignment # field order follows readability, not memory layout
    nolintlint:
      require-explanation: true
      require-specific: true
    revive:
      rules:
        - name: exported
          arguments: [disableStutteringCheck]

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes: [github.com/LeoPenaguin/pixels]
